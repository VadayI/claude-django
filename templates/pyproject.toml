# Place as backend/pyproject.toml
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "Django>=6.0,<7.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.1",
    "django-environ>=0.11",
    "django-filter>=24.0",
    "drf-spectacular>=0.27",
    # JWT auth (Bearer) — user-flow + service-flow; token_blacklist for revocation
    # (ADR 0018). The client_credentials service-flow is a small custom view.
    "djangorestframework-simplejwt>=5.3,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.5",
    # Contract conformance against the external claude-api-contract (ADR 0017).
    # schemathesis: property-based checks (pin to 4.x; OpenAPI 3.1 first-class).
    "schemathesis>=4.0,<5",
    # django-contract-tester: OpenAPI 3.1-capable fork of drf-openapi-tester;
    # same SchemaTester / OpenAPIClient API, validates DRF responses in pytest.
    "django-contract-tester>=1.6",
]
prod = [
    # WSGI server for staging/production. Installed ONLY in the staging image via
    # the Dockerfile `ARG INSTALL_EXTRA=prod` (see docker-compose.staging.yml).
    # Kept out of core deps so the dev/CI image stays thin (dev uses runserver).
    "gunicorn>=22.0",
]

# Explicit package discovery. Without this, setuptools flat-layout auto-discovery
# sees two top-level packages (`apps/` and `config/`) and aborts with
# "Multiple top-level packages discovered", which breaks `pip install -e .` and CI.
[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
# Tests run on a dedicated settings module (config/settings/test.py): it inherits
# dev but adds test-only tweaks (fast password hasher) and owns the test-only
# MIGRATION_MODULES override for apps.common.tests. See .claude/rules/tdd.md.
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
# --reuse-db keeps the Postgres test DB between local runs for a faster loop.
# After changing models/migrations, force a one-time rebuild: pytest --create-db
addopts = "-q --reuse-db"

[tool.coverage.run]
# Measure branch coverage, not only line coverage. Applied automatically to any
# --cov run (e.g. CI's `pytest --cov=apps`), so branches show up in the report.
branch = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# FIX = flake8-fixme: fail on leftover TODO/FIXME/XXX/HACK markers (stub gate, see .claude/rules/no-stubs.md).
# D   = pydocstyle: mandatory Google-style docstrings on public APIs (see .claude/rules/code-style.md).
# (Add "TD" for strict TODO formatting too - noisier.)
select = ["E", "F", "I", "UP", "DJ", "B", "FIX", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests, migrations, app/project __init__.py do not require docstrings on every member.
"**/tests/**" = ["D"]
"**/migrations/**" = ["D"]
"**/__init__.py" = ["D104"]
"config/**" = ["D100", "D101", "D102", "D103", "D104"]
# Last reviewed/updated: 2026-05-27
