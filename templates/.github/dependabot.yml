# Dependabot keeps backend deps and CI actions current, raising weekly PRs.
# Security updates are raised regardless of schedule. PRs go through the normal
# branch -> PR -> review flow (the iron rule); they never push to main directly.
version: 2
updates:
  # Python backend dependencies (PEP 621 deps in backend/pyproject.toml).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"

  # GitHub Actions used by the workflows (e.g. checkout, setup-python).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
      - "ci"
