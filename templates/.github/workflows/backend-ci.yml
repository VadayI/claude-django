name: backend-ci

# Backend code-gate CI. Runs on EVERY PR (no path filters) so a required check
# never hangs Pending on a process-only PR (.claude/**, docs/**) — GitHub's
# "skipped-but-required" trap. Cost: full gates run on doc-only PRs too
# (correctness over a few wasted minutes; the sibling claude-api-contract does the
# same). Lightweight process checks live in the always-on backend-policy.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual trigger so /bootstrap can register the status check before the first
  # PR exists, via `gh workflow run backend-ci.yml --ref main`.
  workflow_dispatch:
    inputs:
      base:
        description: Exact base commit for manual runner verification
        required: true
        type: string
  merge_group:

# Cancel superseded runs for the same PR/branch so a new push stops stale runs.
# Pushes to main are NOT cancelled (we want every main run to complete).
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  family-core:
    name: Family core exact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        if: hashFiles('backend/pyproject.toml') != ''
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Start run-owned PostgreSQL fixture
        run: |
          set -euo pipefail
          fixture_dir="$(mktemp -d)"
          echo "TMPDIR=$fixture_dir" >> "$GITHUB_ENV"
          echo "BACKEND_FIXTURE_DIR=$fixture_dir" >> "$GITHUB_ENV"
          if [ -d backend ]; then
            python scripts/ai/backend_fixture.py start --directory "$fixture_dir"
          fi
      - name: Run exact-candidate Django backend catalog
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_CANDIDATE: ${{ github.sha }}
          CI_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PUSH_BASE: ${{ github.event.before }}
          CI_MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          CI_MANUAL_BASE: ${{ inputs.base }}
        run: |
          set -euo pipefail
          trap 'python scripts/ai/backend_fixture.py stop --directory "$TMPDIR"' EXIT
          case "$CI_EVENT" in
            pull_request) event=pull_request; base="$CI_PR_BASE" ;;
            push) event=push; base="$CI_PUSH_BASE" ;;
            merge_group) event=pull_request; base="$CI_MERGE_BASE" ;;
            workflow_dispatch) event=manual; base="$CI_MANUAL_BASE" ;;
            *) echo "Unsupported CI event: $CI_EVENT" >&2; exit 2 ;;
          esac
          python scripts/ai/runner.py --repository . --candidate "$CI_CANDIDATE" --base "$base" --event "$event" --network allowed --catalog templates/ai/checks/django-backend.json --output .ai-runtime/results/django.json
      - name: Stop run-owned PostgreSQL fixture
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${BACKEND_FIXTURE_DIR:-}" ]; then
            python scripts/ai/backend_fixture.py stop --directory "$BACKEND_FIXTURE_DIR"
            rmdir "$BACKEND_FIXTURE_DIR"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-exact-runner-result
          path: .ai-runtime/results/django.json
          if-no-files-found: warn
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.conformance
      DATABASE_URL: postgres://app:app@localhost:5432/app
      DJANGO_SECRET_KEY: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: NUL / conflict-marker guard
        id: nul
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_nul_bytes.sh .claude/ scripts/ backend/
      - name: Ruff lint
        id: ruff
        run: ruff check .
      - name: Stub gate (no unlogged stubs)
        id: stub
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_stubs.sh
      - name: Migrate test database and start Django for conformance
        id: conformance_server
        run: |
          set -euo pipefail
          python manage.py migrate --noinput

          server_log="$RUNNER_TEMP/django-conformance.log"
          server_pid="$RUNNER_TEMP/django-conformance.pid"
          nohup python manage.py runserver 127.0.0.1:8000 --noreload >"$server_log" 2>&1 &
          echo "$!" > "$server_pid"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ >/dev/null; then
              echo "Django conformance server is ready."
              exit 0
            fi
            if ! kill -0 "$(cat "$server_pid")" 2>/dev/null; then
              cat "$server_log"
              echo "::error::Django conformance server exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done

          cat "$server_log"
          echo "::error::Django conformance server did not become healthy within 60 seconds."
          exit 1
      - name: Contract conformance gate
        id: conformance
        working-directory: ${{ github.workspace }}
        env:
          CONFORMANCE_BASE_URL: http://127.0.0.1:8000
        run: bash scripts/check_contract_conformance.sh
      - name: Stop Django conformance server
        if: always()
        working-directory: ${{ github.workspace }}/backend
        run: |
          set -euo pipefail
          server_pid="$RUNNER_TEMP/django-conformance.pid"
          if [ ! -f "$server_pid" ]; then
            exit 0
          fi

          pid="$(cat "$server_pid")"
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
          fi
      - name: Contract drift gate (vendored copy matches pinned tag)
        id: drift
        working-directory: ${{ github.workspace }}
        # A missing pin is an unverified prerequisite, never a skipped success.
        env:
          CONTRACT_VERSION: ${{ vars.CONTRACT_VERSION }}
          CONTRACT_REPO: ${{ vars.CONTRACT_REPO || 'VadayI/claude-api-contract' }}
        run: |
          if [ -z "$CONTRACT_VERSION" ]; then
            echo "::error::CONTRACT_VERSION is missing; set the reviewed contract pin before GitHub CI."
            exit 1
          fi
          bash scripts/pull_contract.sh --check || {
            echo "::error ::openapi.yml differs from pinned ${CONTRACT_REPO}@${CONTRACT_VERSION}. Re-run 'bash scripts/pull_contract.sh' and commit."
            exit 1
          }
      - name: Per-app README gate
        id: readme
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_app_readmes.sh
      - name: File-size gate (no file over 800 lines)
        id: filesize
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_file_size.sh
      - name: Tests + coverage
        id: pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=apps --cov-report=term-missing
      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## backend-ci gates"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| NUL / conflict-marker | ${{ steps.nul.outcome }} |"
            echo "| ruff | ${{ steps.ruff.outcome }} |"
            echo "| stub ledger | ${{ steps.stub.outcome }} |"
            echo "| contract conformance | ${{ steps.conformance.outcome }} |"
            echo "| contract drift (vendored = pinned) | ${{ steps.drift.outcome }} |"
            echo "| per-app README | ${{ steps.readme.outcome }} |"
            echo "| file-size (<800) | ${{ steps.filesize.outcome }} |"
            echo "| pytest (+branch cov) | ${{ steps.pytest.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
# Last reviewed/updated: 2026-06-09 (add contract drift-gate, ADR 0021)
