name: backend-ci
on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/STUBS.md"
      - "docs/api/openapi.yml"
      - "scripts/check_stubs.sh"
      - "scripts/pull_contract.sh"
      - "scripts/check_contract_conformance.sh"
      - "scripts/check_app_readmes.sh"
      - "scripts/check_file_size.sh"
      - ".github/workflows/backend-ci.yml"
  # Run on push to main so GitHub registers `backend-ci` as a known status
  # check on the very first push. Without this, branch protection that
  # requires `backend-ci` blocks every subsequent PR (chicken-and-egg).
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/STUBS.md"
      - "docs/api/openapi.yml"
      - "scripts/check_stubs.sh"
      - "scripts/pull_contract.sh"
      - "scripts/check_contract_conformance.sh"
      - "scripts/check_app_readmes.sh"
      - "scripts/check_file_size.sh"
      - ".github/workflows/backend-ci.yml"
  # Manual trigger so /bootstrap can register the status check before the
  # first PR exists, via `gh workflow run backend-ci.yml --ref main`.
  workflow_dispatch:
# Cancel superseded runs for the same PR/branch so a new push stops stale runs.
# Pushes to main are NOT cancelled (we want every main run to complete).
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 3s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://app:app@localhost:5432/app
      DJANGO_SECRET_KEY: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        id: ruff
        run: ruff check .
      - name: Stub gate (no unlogged stubs)
        id: stub
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_stubs.sh
      - name: Contract conformance gate
        id: conformance
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_contract_conformance.sh
      - name: Per-app README gate
        id: readme
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_app_readmes.sh
      - name: File-size gate (no file over 800 lines)
        id: filesize
        working-directory: ${{ github.workspace }}
        run: bash scripts/check_file_size.sh
      - name: Tests + coverage
        id: pytest
        run: pytest --cov=apps --cov-report=term-missing
      - name: Job summary
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo "## backend-ci gates"
            echo ""
            echo "| Gate | Result |"
            echo "|------|--------|"
            echo "| ruff | ${{ steps.ruff.outcome }} |"
            echo "| stub ledger | ${{ steps.stub.outcome }} |"
            echo "| contract conformance | ${{ steps.conformance.outcome }} |"
            echo "| per-app README | ${{ steps.readme.outcome }} |"
            echo "| file-size (<800) | ${{ steps.filesize.outcome }} |"
            echo "| pytest (+branch cov) | ${{ steps.pytest.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
# Last reviewed/updated: 2026-06-06 (drift gate -> contract conformance, ADR 0017)
